name: Refresh stats cards

on:
  schedule:
    - cron: "0 2 * * *" # once a day, at 2am UTC
  workflow_dispatch: # lets you re-run it manually
  push:
    branches:
      - main
    paths:
      - "cards/generate.py"
      - ".github/workflows/refresh-cards.yml"

permissions:
  contents: write # needed to commit the refreshed cards

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cards from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python cards/generate.py

      - name: Validate (fail on anything that is not a clean SVG)
        run: |
          for f in cards/stats.svg cards/top-langs.svg; do
            head -c 100 "$f" | grep -q "<svg" || { echo "::error::$f does not start with <svg>"; exit 1; }
            grep -qi "DOCTYPE\|<html\|went wrong\|rate limit" "$f" && { echo "::error::$f contains error-page content"; exit 1; }
          done

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/
          if git diff --cached --quiet; then
            echo "No changes — cards are up to date"
          else
            git commit -m "chore: refresh stats cards [skip ci]"
            git push
          fi
